<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{ISSUE-ID}} {{主題}}導覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* 版面：16:9 固定畫布（1600×900）由 JS 等比縮放；每頁＝一段對話＋一份實際程式碼或操作步驟。
     單一亮色紙面（刻意不做深色版），沿用 MCP 簡報的配色與元件。 */
  :root {
    --paper: #fbf9f6;
    --ink: #1c2230;
    --ink-soft: #4a5263;
    --muted: #7f8592;
    --line: #e4e0d8;
    --card: #ffffff;
    --chip-bg: #efece6;
    --accent: #d9506f;  --accent-soft: #fbe7ec;
    --blue: #3667a6;    --blue-soft: #e5eef8;
    --green: #2f8a63;   --green-soft: #e3f3eb;
    --amber: #b7791f;   --amber-soft: #fbf0dc;
    --violet: #6b56b8;  --violet-soft: #ece8f8;
    --code-bg: #1f2430; --code-ink: #e6e6e6; --code-hl: rgba(246,193,119,.14); --code-dim: #7d8598;
    --stage: #14171f;
    --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --mono: "JetBrains Mono", "Cascadia Code", Consolas, "Noto Sans Mono CJK TC", monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--stage); overflow: hidden; font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }

  #deck {
    position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px;
    transform-origin: center center; background: var(--paper); overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .slide { position: absolute; inset: 0; padding: 56px 88px 84px; display: none; flex-direction: column; font-size: 24px; line-height: 1.55; }
  .slide.active { display: flex; animation: fade .22s ease-out; }
  /* 防溢出：格狀／彈性排版的子元素一律可收縮，長字串（路徑、指令）一律可斷行，避免撐破外框 */
  .slide * { min-width: 0; }
  .slide :where(p, li, td, th, .bubble, .card, .chip, .cap, .look) { overflow-wrap: anywhere; }
  @keyframes fade { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .slide.active { animation: none; } }

  .slide[data-chapter="1"] { --chapter: var(--accent); }
  .slide[data-chapter="2"] { --chapter: var(--blue); }
  .slide[data-chapter="3"] { --chapter: var(--green); }
  .slide[data-chapter="4"] { --chapter: var(--amber); }
  .slide[data-chapter="5"] { --chapter: var(--violet); }

  .kicker { font-size: 18px; font-weight: 700; letter-spacing: .14em; color: var(--chapter, var(--accent)); margin-bottom: 6px; }
  h1 { font-size: 84px; line-height: 1.15; font-weight: 900; text-wrap: balance; }
  h2 { font-size: 44px; line-height: 1.25; font-weight: 900; margin-bottom: 18px; text-wrap: balance; }
  h3 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .lead { font-size: 27px; color: var(--ink-soft); }
  .small { font-size: 20px; color: var(--ink-soft); }
  .tiny { font-size: 16px; color: var(--muted); }
  code.i { font-family: var(--mono); font-size: .84em; background: var(--chip-bg); border-radius: 6px; padding: 1px 7px; overflow-wrap: anywhere; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: safe center; }
  .cols { display: grid; gap: 36px; align-items: start; min-height: 0; }
  .cols > * { min-width: 0; }
  .c-2 { grid-template-columns: 1fr 1fr; }
  .c-talk { grid-template-columns: 520px 1fr; }
  .c-talk-wide { grid-template-columns: 460px 1fr; }
  .stack { display: flex; flex-direction: column; gap: 16px; }

  /* ── 對話 ───────────────────────────────────────────── */
  .chat { display: flex; flex-direction: column; gap: 12px; }
  .say { display: grid; grid-template-columns: 46px 1fr; gap: 12px; align-items: start; }
  .say .av { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 20px; color: #fff; background: var(--who); }
  .say .bubble { background: var(--card); border: 1px solid var(--line); border-radius: 4px 16px 16px 16px; padding: 10px 16px 12px; font-size: 21px; line-height: 1.5; }
  .say .bubble b.n { display: block; font-size: 15px; letter-spacing: .06em; color: var(--who); margin-bottom: 2px; }
  .say.you .bubble { background: var(--chip-bg); }
  .you   { --who: #59606f; }
  .architect  { --who: var(--accent); }
  .backend    { --who: var(--blue); }
  .frontend   { --who: var(--green); }
  .integrator { --who: var(--amber); }
  .reviewer   { --who: var(--violet); }

  /* ── 卡片與標籤 ─────────────────────────────────────── */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 24px; }
  .card p { font-size: 20px; color: var(--ink-soft); line-height: 1.5; }
  .tone-blue { background: var(--blue-soft); border-color: #c6d8ee; }
  .tone-green { background: var(--green-soft); border-color: #bfe1cf; }
  .tone-amber { background: var(--amber-soft); border-color: #ecd6ad; }
  .tone-accent { background: var(--accent-soft); border-color: #f1c3cf; }
  .tag { display: inline-block; font-size: 15px; font-weight: 700; letter-spacing: .06em; padding: 2px 11px; border-radius: 999px; margin-bottom: 10px; background: var(--ink); color: #fff; }
  .tag.blue { background: var(--blue); } .tag.green { background: var(--green); } .tag.amber { background: var(--amber); } .tag.accent { background: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-family: var(--mono); font-size: 16px; padding: 3px 10px; border-radius: 7px; background: var(--card); border: 1px solid var(--line); color: var(--ink-soft); }
  .chip.op { font-family: var(--font); font-size: 18px; background: var(--green-soft); border-color: #bfe1cf; color: var(--ink); }
  ul.pts { list-style: none; display: grid; gap: 8px; }
  ul.pts li { position: relative; padding-left: 24px; font-size: 20px; color: var(--ink-soft); line-height: 1.5; }
  ul.pts li::before { content: ""; position: absolute; left: 2px; top: .6em; width: 10px; height: 10px; border-radius: 3px; background: var(--chapter, var(--accent)); }

  /* ── 程式碼 ─────────────────────────────────────────── */
  .codebox { min-width: 0; display: flex; flex-direction: column; }
  pre.code { font-family: var(--mono); font-size: 16px; line-height: 1.5; background: var(--code-bg); color: var(--code-ink);
    border-radius: 12px; padding: 14px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* 過長的行折到下一行並縮排，維持在框內 */
  pre.code .ln { display: block; padding: 0 22px 0 46px; text-indent: -24px; }
  pre.code .ln.hl { background: var(--code-hl); box-shadow: inset 4px 0 0 #f6c177; }
  pre.code .k { color: #ff8fa8; } pre.code .s { color: #a8e0a0; } pre.code .f { color: #8cc4ff; }
  pre.code .c { color: #8a93a6; font-style: italic; } pre.code .n { color: #f6c177; } pre.code .el { color: var(--code-dim); }
  .cap { font-family: var(--mono); font-size: 14px; color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
  .cap b { color: var(--ink-soft); font-weight: 600; }

  /* ── 流程方塊 ───────────────────────────────────────── */
  .flow { display: flex; align-items: stretch; }
  .flow .node { flex: 1; background: var(--card); border: 2px solid var(--ink); border-radius: 12px; padding: 12px 14px; text-align: center; font-size: 20px; font-weight: 700; line-height: 1.35; display: flex; flex-direction: column; justify-content: center; }
  .flow .node small { display: block; font-size: 15px; font-weight: 400; color: var(--ink-soft); margin-top: 4px; }
  .flow .node.a { border-color: var(--accent); background: var(--accent-soft); }
  .flow .node.b { border-color: var(--blue); background: var(--blue-soft); }
  .flow .node.g { border-color: var(--green); background: var(--green-soft); }
  .flow .arrow { flex: 0 0 48px; align-self: center; height: 3px; background: var(--ink); position: relative; margin: 0 6px; }
  .flow .arrow::after { content: ""; position: absolute; right: -2px; top: -7px; border-left: 13px solid var(--ink); border-top: 8.5px solid transparent; border-bottom: 8.5px solid transparent; }

  /* ── 前後對照 .vs：改動前（左）→ 改動後（右）────────── */
  .vs { display: grid; grid-template-columns: 1fr 56px 1fr; align-items: stretch; }
  .vs .side { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
  .vs .side > b { font-size: 15px; letter-spacing: .08em; }
  .vs .side.before { border-style: dashed; color: var(--ink-soft); }
  .vs .side.before > b { color: var(--muted); }
  .vs .side.after { border-color: var(--green); background: var(--green-soft); }
  .vs .side.after > b { color: var(--green); }
  .vs .side p, .vs .side li { font-size: 19px; line-height: 1.45; }
  .vs .side ul { list-style: none; display: grid; gap: 6px; }
  .vs .side li::before { content: "· "; font-weight: 900; }
  .vs .to { align-self: center; justify-self: center; width: 0; height: 0; border-left: 22px solid var(--ink); border-top: 15px solid transparent; border-bottom: 15px solid transparent; }

  /* ── 泳道／時序 .lanes：每列一個角色，欄＝時間先後；.step 以 --at 指定第幾欄 ── */
  .lanes { --cols: 4; display: grid; gap: 10px; }
  .lane { display: grid; grid-template-columns: 140px 1fr; gap: 14px; align-items: center; }
  .lane .who { font-weight: 900; font-size: 18px; color: #fff; background: var(--who, var(--ink)); border-radius: 10px; padding: 10px 12px; text-align: center; }
  .lane .track { display: grid; grid-template-columns: repeat(var(--cols), 1fr); column-gap: 28px; align-items: center; min-height: 56px; border-bottom: 2px dashed var(--line); padding-bottom: 6px; }
  .lane .step { grid-column: var(--at, auto); grid-row: 1; background: var(--card); border: 2px solid var(--who, var(--ink)); border-radius: 10px; padding: 6px 12px; font-size: 17px; line-height: 1.35; text-align: center; }
  .lanes .time { display: grid; grid-template-columns: 140px 1fr; gap: 14px; font-size: 14px; color: var(--muted); }
  .lanes .time span { position: relative; height: 18px; }
  .lanes .time span::before { content: ""; position: absolute; left: 0; right: 10px; top: 8px; height: 2px; background: var(--muted); }
  .lanes .time span::after { content: ""; position: absolute; right: 0; top: 3px; border-left: 11px solid var(--muted); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }

  /* ── 分支決策 .branch：上方問題，下方各選項的結果 ───── */
  .branch { display: flex; flex-direction: column; align-items: center; }
  .branch .q { background: var(--amber-soft); border: 2px solid var(--amber); border-radius: 12px; padding: 10px 22px; font-size: 21px; font-weight: 700; text-align: center; }
  .branch .stem { width: 3px; height: 20px; background: var(--ink); }
  .branch .opts { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; width: 100%; }
  .branch .opt { position: relative; display: flex; flex-direction: column; align-items: center; padding: 0 10px; }
  .branch .opt::after { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--ink); }
  .branch .opt:first-child::after { left: 50%; }
  .branch .opt:last-child::after { right: 50%; }
  .branch .opt::before { content: ""; width: 3px; height: 22px; background: var(--ink); }
  .branch .opt .when { font-size: 15px; font-weight: 700; letter-spacing: .06em; color: var(--ink-soft); background: var(--chip-bg); border-radius: 999px; padding: 2px 12px; margin-bottom: 8px; }
  .branch .opt .res { width: 100%; background: var(--card); border: 2px solid var(--ink); border-radius: 12px; padding: 10px 14px; text-align: center; font-size: 19px; font-weight: 700; line-height: 1.35; }
  .branch .opt .res small { display: block; font-size: 15px; font-weight: 400; color: var(--ink-soft); margin-top: 4px; }
  .branch .opt.ok .res { border-color: var(--green); background: var(--green-soft); }
  .branch .opt.ng .res { border-color: var(--accent); background: var(--accent-soft); }

  /* ── 數字磁磚 .stats：有出處的數字（測試數、頁數…）── */
  .stats { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-top: 5px solid var(--chapter, var(--accent)); border-radius: 12px; padding: 14px 18px; }
  .stat .v { display: block; font-size: 52px; font-weight: 900; line-height: 1.1; color: var(--ink); }
  .stat .v small { font-size: 22px; font-weight: 700; color: var(--ink-soft); margin-left: 4px; }
  .stat .l { display: block; font-size: 17px; color: var(--ink-soft); margin-top: 4px; }

  /* ── 步驟 ───────────────────────────────────────────── */
  ol.steps { list-style: none; counter-reset: s; display: grid; gap: 12px; }
  ol.steps li { counter-increment: s; position: relative; padding-left: 50px; font-size: 20px; line-height: 1.5; color: var(--ink-soft); }
  ol.steps li b { color: var(--ink); }
  ol.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-radius: 50%;
    background: var(--chapter, var(--accent)); color: #fff; font-weight: 900; font-size: 17px; display: flex; align-items: center; justify-content: center; }
  .cmd { display: block; font-family: var(--mono); font-size: 15px; background: var(--code-bg); color: var(--code-ink); border-radius: 8px; padding: 7px 12px; margin-top: 5px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .look { display: block; font-size: 17px; color: var(--green); margin-top: 3px; }
  .look::before { content: "看到 → "; font-weight: 700; }

  /* ── 表格 ───────────────────────────────────────────── */
  table.t { width: 100%; border-collapse: collapse; font-size: 18px; line-height: 1.45; }
  table.t th, table.t td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  table.t th { font-size: 15px; letter-spacing: .06em; color: var(--muted); border-bottom: 2px solid var(--ink); white-space: nowrap; }
  table.t td:first-child { font-weight: 700; white-space: nowrap; }
  table.t tr.pick td { background: var(--amber-soft); }

  /* ── 操作矩陣示意（HTML 繪製，非截圖）──────────────── */
  .matrix { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; }
  .matrix .grp { font-weight: 700; font-size: 19px; margin-bottom: 4px; }
  .mrow { display: grid; grid-template-columns: 170px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .mrow:last-child { border-bottom: 0; }
  .cb { display: inline-flex; align-items: center; gap: 6px; font-size: 17px; margin: 2px 14px 2px 0; white-space: nowrap; }
  .cb i { width: 18px; height: 18px; border-radius: 3px; border: 2px solid #6b7280; display: inline-block; position: relative; flex: none; }
  .cb.on i { background: #1976d2; border-color: #1976d2; }
  .cb.on i::after { content: ""; position: absolute; left: 4px; top: 0; width: 5px; height: 10px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
  .cb.half i { background: #1976d2; border-color: #1976d2; }
  .cb.half i::after { content: ""; position: absolute; left: 2px; right: 2px; top: 6px; height: 2.5px; background: #fff; }
  .cb.off-dis i { border-color: var(--line); }
  .cb.off-dis { color: var(--muted); }
  .cb.head { font-weight: 700; font-size: 18px; }
  .toast { margin-top: 12px; font-size: 16px; background: #e5f3fd; color: #014361; border-radius: 8px; padding: 8px 12px; }

  /* ── 檔案樹 ─────────────────────────────────────────── */
  .tree { font-family: var(--mono); font-size: 16px; line-height: 1.5; }
  .tree .root { font-weight: 600; font-size: 18px; margin-bottom: 4px; }
  .tree ul { list-style: none; margin-left: 9px; padding-left: 0; }
  .tree li { position: relative; padding: 2px 0 2px 22px; border-left: 2px solid var(--line); }
  .tree li:last-child { border-left-color: transparent; }
  .tree li::before { content: ""; position: absolute; left: -2px; top: 0; width: 16px; height: 15px; border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); border-bottom-left-radius: 6px; }
  .tree .d { color: var(--blue); font-weight: 600; }
  .tree .f { color: var(--ink); }
  .tree em { font-style: normal; font-family: var(--font); font-size: 14px; color: var(--muted); margin-left: 10px; white-space: nowrap; }

  /* ── 封面與人物 ─────────────────────────────────────── */
  .cover { justify-content: center; background:
      radial-gradient(1100px 560px at 108% -12%, #fbe1e8 0, transparent 60%),
      radial-gradient(900px 500px at -10% 120%, #e2ecf8 0, transparent 60%), var(--paper); }
  .cover .bar { width: 110px; height: 8px; border-radius: 4px; background: var(--accent); margin-bottom: 30px; }
  .cover .meta { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 12px; }
  .cast { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 16px; }
  .cast .p { text-align: center; padding: 18px 12px; }
  .cast .p .av { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; color: #fff; background: var(--who); }
  .cast .p h3 { margin: 0; font-size: 22px; }
  .cast .p p { font-size: 16px; color: var(--ink-soft); line-height: 1.45; }
  .route { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 14px; margin-top: 26px; }
  .route .r { border-top: 5px solid var(--c); padding-top: 10px; }
  .route .r b { display: block; font-size: 15px; color: var(--c); letter-spacing: .08em; }
  .route .r span { font-size: 19px; font-weight: 700; }

  /* ── 頁尾與控制 ─────────────────────────────────────── */
  #footer { position: absolute; left: 88px; right: 88px; bottom: 28px; display: flex; align-items: center; gap: 18px; font-size: 15px; color: var(--muted); pointer-events: none; }
  #progress { flex: 1; display: flex; gap: 5px; }
  #progress i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
  #progress i.done { background: var(--c, var(--ink)); }
  #pageno { font-family: var(--mono); min-width: 64px; text-align: right; }
  #chapter-name { min-width: 230px; }
  #nav { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(6px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; z-index: 5; }
  #nav button { font: 600 14px var(--font); color: var(--ink-soft); background: rgba(255,255,255,.85); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  #nav button:hover { background: var(--card); color: var(--ink); }
  #nav button:focus-visible { outline: 2px solid #f6c177; outline-offset: 2px; }
  #hint { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); top: calc(8px + env(safe-area-inset-top, 0px)); color: #9aa0ab; font-size: 13px; opacity: .75; }
</style>
</head>
<body>
<div id="hint">← → 或空白鍵翻頁 · F 全螢幕</div>
<div id="nav"><button type="button" id="prev" aria-label="上一頁">‹ 上一頁</button><button type="button" id="next" aria-label="下一頁">下一頁 ›</button></div>

<div id="deck">

<!-- STORY:SLIDES 投影片放這裡（每頁一個 <section class="slide">）；元件用法見 docs/story/ 既有導覽 -->

<div id="footer"><span id="chapter-name"></span><div id="progress"></div><span id="pageno"></span></div>
</div>

<script>
(function () {
  // ── 語法上色：逐行處理，支援 py / ts / json；data-hl="3-5,8" 標示重點行 ──
  var KW = {
    py: "class def return if elif else for in not and or is None True False import from as with raise continue while lambda pass yield try except finally",
    ts: "export const let var return if else for of in new type import from as typeof null true false undefined function",
    json: "true false null"
  };
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function paint(line, lang) {
    if (line.trim() === "…") return '<span class="el">' + esc(line) + "</span>";
    var kws = new RegExp("^(?:" + KW[lang].split(" ").join("|") + ")$");
    var cm = lang === "py" ? "#.*$" : lang === "ts" ? "\\/\\/.*$" : "(?!)";
    var re = new RegExp("(" + cm + ")|((?:[rf]?)\"(?:\\\\.|[^\"\\\\])*\"|'(?:\\\\.|[^'\\\\])*'|`[^`]*`)|(@?[A-Za-z_][A-Za-z0-9_]*)(?=\\s*\\()|(\\b\\d+\\b)|([A-Za-z_][A-Za-z0-9_]*)", "g");
    var out = "", last = 0, m;
    while ((m = re.exec(line))) {
      out += esc(line.slice(last, m.index));
      if (m[1]) out += '<span class="c">' + esc(m[1]) + "</span>";
      else if (m[2]) out += '<span class="s">' + esc(m[2]) + "</span>";
      else if (m[3]) out += kws.test(m[3]) ? '<span class="k">' + esc(m[3]) + "</span>" : '<span class="f">' + esc(m[3]) + "</span>";
      else if (m[4]) out += '<span class="n">' + m[4] + "</span>";
      else out += kws.test(m[5]) ? '<span class="k">' + esc(m[5]) + "</span>" : esc(m[5]);
      last = re.lastIndex;
    }
    return out + esc(line.slice(last));
  }
  function parseHl(spec) {
    var set = {};
    (spec || "").split(",").forEach(function (part) {
      var r = part.split("-").map(Number);
      if (!r[0]) return;
      for (var i = r[0]; i <= (r[1] || r[0]); i++) set[i] = true;
    });
    return set;
  }
  document.querySelectorAll("pre.code").forEach(function (pre) {
    var lang = pre.dataset.lang || "py", hl = parseHl(pre.dataset.hl);
    pre.innerHTML = pre.textContent.replace(/\n$/, "").split("\n").map(function (line, i) {
      return '<span class="ln' + (hl[i + 1] ? " hl" : "") + '">' + (paint(line, lang) || " ") + "</span>";
    }).join("");
  });

  // ── 翻頁、縮放、頁尾 ──
  var deck = document.getElementById("deck");
  var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
  var colors = { 0: "var(--ink)", 1: "var(--accent)", 2: "var(--blue)", 3: "var(--green)", 4: "var(--amber)", 5: "var(--violet)" };
  var progress = document.getElementById("progress");
  slides.forEach(function (s) { var i = document.createElement("i"); i.style.setProperty("--c", colors[s.dataset.chapter] || "var(--ink)"); progress.appendChild(i); });
  var bars = progress.children, cur = 0;

  function fromHash() { var m = /^#s(\d+)$/.exec(location.hash); var n = m ? +m[1] - 1 : 0; return Math.min(Math.max(n, 0), slides.length - 1); }
  function show(n) {
    cur = Math.min(Math.max(n, 0), slides.length - 1);
    slides.forEach(function (s, i) { s.classList.toggle("active", i === cur); });
    for (var i = 0; i < bars.length; i++) bars[i].classList.toggle("done", i <= cur);
    document.getElementById("pageno").textContent = (cur + 1) + " / " + slides.length;
    document.getElementById("chapter-name").textContent = slides[cur].dataset.name || "";
    if (location.hash !== "#s" + (cur + 1)) history.replaceState(null, "", "#s" + (cur + 1));
  }
  function fit() {
    var root = getComputedStyle(document.documentElement);
    var w = window.innerWidth, h = window.innerHeight - (parseFloat(root.paddingTop) || 0) - (parseFloat(root.paddingBottom) || 0);
    deck.style.transform = "translate(-50%, -50%) scale(" + Math.min(w / 1600, h / 900) + ")";
  }
  document.addEventListener("keydown", function (e) {
    if (["ArrowRight", "PageDown", " "].indexOf(e.key) >= 0) { e.preventDefault(); show(cur + 1); }
    else if (["ArrowLeft", "PageUp"].indexOf(e.key) >= 0) { e.preventDefault(); show(cur - 1); }
    else if (e.key === "Home") show(0);
    else if (e.key === "End") show(slides.length - 1);
    else if (e.key === "f" || e.key === "F") {
      try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(function () {}); } catch (err) {}
    }
  });
  document.getElementById("prev").addEventListener("click", function () { show(cur - 1); });
  document.getElementById("next").addEventListener("click", function () { show(cur + 1); });
  var x0 = null;
  deck.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  deck.addEventListener("touchend", function (e) { if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1)); x0 = null; });
  window.addEventListener("hashchange", function () { show(fromHash()); });
  window.addEventListener("resize", fit);
  fit(); show(fromHash());
})();
</script>
</body>
</html>
